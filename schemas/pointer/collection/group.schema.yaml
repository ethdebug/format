$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schema:ethdebug/format/pointer/collection/group"

title: ethdebug/format/pointer/collection/group
description: |
  A composite collection of pointers
type: object
properties:
  name:
    $ref: "schema:ethdebug/format/pointer/collection#/$defs/Name"

  group:
    type: array
    items:
      $ref: "schema:ethdebug/format/pointer"
    minItems: 1
required:
  - group
additionalProperties: false

examples:
  - group:
      - name: "data-pointer"
        location: stack
        slot: 0
      - location: memory
        offset:
          ~read: "data-pointer"
        length: 32

  - # example: a named group. its regions have the path ["record"]
    name: "record"
    group:
      - name: "x"
        location: storage
        slot: 0
      - name: "y"
        location: storage
        slot: 1
