$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schema:ethdebug/format/pointer/identifier"

title: ethdebug/format/pointer/identifier
description: |
  An identifier for use within the context of a root pointer

  The allowed characters seek to admit identifiers from common existing
  languages as they are, so a compiler can use a source-language name
  without renaming it. An identifier **must not** start with `~`: that
  prefix is reserved for the format's own terms in pointer expressions
  (e.g., `~wordsize`, `~this`, `~sum`), so a name can never be confused with
  one of them.
type: string
pattern: "^[a-zA-Z$_\\-]+[a-zA-Z0-9$_\\-]*$"

examples:
  - a
  - a0
  - -$
  - __init__
  - $balance
