$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schema:ethdebug/format/type/complex/alias"

title: ethdebug/format/type/complex/alias
description: |
  Schema representing a type alias to another type.

  Standard interpretation: the value is read as the `contains` type. An
  alias does not change how the value is read.

type: object
properties:
  label:
    $ref: "schema:ethdebug/format/type/base#/$defs/Label"
  class:
    type: string
    const: complex
  kind:
    type: string
    const: alias
  contains:
    $ref: "schema:ethdebug/format/type/wrapper"
  definition:
    $ref: "schema:ethdebug/format/type/definition"

required:
  - kind
  - contains

examples:
  - kind: alias
    contains:
      type:
        kind: number

  - kind: alias
    contains:
      type:
        kind: array
        contains:
          type:
            class: elementary
            kind: super-uint # unsupported type
            blits: -256
