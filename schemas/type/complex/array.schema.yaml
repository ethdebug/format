$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schema:ethdebug/format/type/complex/array"

title: ethdebug/format/type/complex/array
description: |
  Schema for representing array types. An array type specifies the
  element type it contains. It has no element count. The number of
  elements comes from the value's location.

type: object
properties:
  label:
    $ref: "schema:ethdebug/format/type/base#/$defs/Label"
  class:
    type: string
    const: complex
  kind:
    type: string
    const: array
  contains:
    description: |
      The element type contained by this array, specified as an
      **ethdebug/format/type/wrapper**.
    $ref: "schema:ethdebug/format/type/wrapper"

required:
  - kind
  - contains

examples:
  # example: a dynamically-sized array of uint256
  - kind: array
    contains:
      type:
        kind: number

  # example: an array of addresses
  - kind: array
    label: "address[10]"
    contains:
      type:
        kind: address

  # example: a nested array with an unknown element type
  - kind: array
    contains:
      type:
        kind: array
        contains:
          type:
            class: elementary
            kind: super-uint # unsupported type
            blits: -256
