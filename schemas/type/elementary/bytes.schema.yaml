$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schema:ethdebug/format/type/elementary/bytes"

title: ethdebug/format/type/elementary/bytes
description: |
  Schema describing the representation of a type of bytes string.

  Standard interpretation: the value is the bytes, in order. This type has
  no size. The number of bytes comes from the value's location.

type: object
properties:
  label:
    $ref: "schema:ethdebug/format/type/base#/$defs/Label"
  class:
    const: elementary
  kind:
    const: bytes
required:
  - kind
examples:
  - kind: bytes
  - kind: bytes
    label: bytes32
